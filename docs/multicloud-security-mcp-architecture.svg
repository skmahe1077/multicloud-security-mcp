<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="680" height="700" viewBox="0 0 680 700" role="img" aria-label="multicloud-security-mcp architecture diagram">
<title>multicloud-security-mcp architecture</title>
<desc>Claude Desktop MCP client connects over stdio to MCP server, shared modules and cloud security services across AWS, Azure and GCP. Retry utilities are duplicated inside individual tool files.</desc>
<style>
 text { font-family: Inter, Arial, Helvetica, sans-serif; fill:#1e2432; }
 .hd {font-size:12px;font-weight:700;} .sub {font-size:9px;font-weight:600;} .txt {font-size:9px;} .tiny {font-size:8px;} .uri {font-size:8.2px;font-family: ui-monospace, SFMono-Regular, Consolas, monospace;} .arrow {fill:none;stroke:#56566e;stroke-width:1.5;stroke-linejoin:round;} 
</style>
