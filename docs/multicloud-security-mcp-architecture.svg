<!-- Background -->
<rect width="680" height="660" fill="#ffffff" rx="0"/>

<!-- MCP Client -->
<rect x="200" y="20" width="280" height="52" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
